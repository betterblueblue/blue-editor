<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https: http:; font-src 'self' data:; script-src 'self' 'sha256-qR4U4J3Ne5n0m3uNzGMB/tZ3TWJUf89OlxdXqjqALDM='; object-src 'none'; frame-src 'none'">
  <title>Blue Editor</title>
  <link rel="stylesheet" href="../../node_modules/vditor/dist/index.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <div id="conflictbar" class="hidden">
    <span>文件已被外部修改</span>
    <button id="cf-reload">重载</button>
    <button id="cf-ignore">忽略</button>
  </div>
  <div id="findbar" class="hidden">
    <input id="find-input" placeholder="查找" type="text">
    <span id="find-count"></span>
    <button id="find-prev" title="上一个">↑</button>
    <button id="find-next" title="下一个">↓</button>
    <input id="replace-input" placeholder="替换为" type="text">
    <button id="replace-all" title="全部替换">全部替换</button>
    <button id="find-close" title="关闭">×</button>
  </div>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-tabs">
        <button data-tab="files" class="tab active">文件</button>
        <button data-tab="outline" class="tab">大纲</button>
      </div>
      <div id="sidebar-files" class="sidebar-pane">
        <div id="dir-current" title=""></div>
        <ul id="dir-list"></ul>
      </div>
      <div id="sidebar-outline" class="sidebar-pane hidden">
        <ul id="outline-list"></ul>
      </div>
      <div id="ctxmenu" class="hidden"></div>
      <div id="histdlg" class="hidden">
        <div id="histdlg-box">
          <div id="hist-head">
            <span>版本历史</span>
            <button id="hist-close">×</button>
          </div>
          <div id="hist-body">
            <div id="hist-list"></div>
            <div id="hist-diff"></div>
          </div>
          <div id="hist-foot">
            <button id="hist-restore">恢复此版本</button>
            <button id="hist-clear">清空历史</button>
          </div>
        </div>
      </div>
      <div id="wcdlg" class="hidden">
        <div id="wcdlg-box">
          <div id="wc-head">
            <span>复制为公众号格式</span>
            <button id="wc-close">×</button>
          </div>
          <div id="wc-body">
            <div id="wc-themes"></div>
            <div id="wc-frame"></div>
          </div>
          <div id="wc-foot">
            <button id="wc-copy">复制</button>
          </div>
        </div>
      </div>
      <div id="inputdlg" class="hidden">
        <div id="inputdlg-box">
          <input id="inputdlg-input" type="text">
          <div class="dlg-btns">
            <button id="inputdlg-ok">确定</button>
            <button id="inputdlg-cancel">取消</button>
          </div>
        </div>
      </div>
      <div id="msgdlg" class="hidden">
        <div id="msgdlg-box">
          <div id="msgdlg-text"></div>
          <div class="dlg-btns"></div>
        </div>
      </div>
    </aside>
    <div id="vditor"></div>
  </div>
  <script src="../../node_modules/vditor/dist/index.min.js"></script>
  <script src="wechat-themes.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
